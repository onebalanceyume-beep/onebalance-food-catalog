      <div class="hero__ornament hero__ornament--right" aria-hidden="true"></div>
      <p class="hero__eyebrow">ONE BALANCE METHOD</p>
      <h1 class="hero__title">ONE BALANCE 食事図鑑</h1>
      <p class="hero__subtitle">あなたの体を整える、選ばれた食材たち</p>
      <div class="hero__note">

        スーパー・コンビニで「今日これ買おう」とすぐ決めやすい、やさしい食材カタログ
      </div>
    </header>

    <main class="content">
      <section class="tabs-section" aria-label="カテゴリ切り替え">

          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-filter="ALL">すべて</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-filter="P">タンパク質(P)</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-filter="F">脂質(F)</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-filter="C">炭水化物(C)</button>
        </div>
      </section>

      <section class="overview" aria-label="一覧概要">
        <div class="overview__card">
          <p class="overview__label">表示カテゴリ</p>
          <p class="overview__value" id="currentCategoryLabel">すべて</p>
        </div>
        <div class="overview__card">
          <p class="overview__label">表示件数</p>
          <p class="overview__value"><span id="foodCount">0</span> 品目</p>
        </div>
      </section>

      <section aria-label="食材一覧">
        <div class="card-grid" id="foodGrid"></div>
        <div class="empty-state hidden" id="emptyState" aria-live="polite">
          <p class="empty-state__title">このカテゴリは準備中です</p>
          <p class="empty-state__text">「すべて」または別カテゴリを選ぶと、対象の食材が表示されます。</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__title">ONE BALANCE METHOD</p>
      <p class="footer__subtitle">ONE-TRE 監修</p>
    </footer>
